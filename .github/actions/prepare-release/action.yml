name: 'Prepare Release'
description: 'Create a release branch, update its changelog, and open a release pull request.'


inputs:
  access-token:
    description: 'GitHub Token for authentication.'
    required: true

  tag-name:
    description: 'Original Git tag that triggered release preparation.'
    required: true

  commit-user-name:
    description: 'Git user name for commit.'
    required: false
    default: 'github-actions[bot]'

  commit-user-email:
    description: 'Git user email for commit.'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'

  packages:
    description: 'JSON object mapping monorepo package names to workspace directories.'
    required: false
    default: '{}'

  changelog-configuration-path:
    description: 'Path to the checked-out git-cliff configuration file.'
    required: true

  working-directory:
    description: 'Checked-out caller repository containing the release tag.'
    required: false
    default: '.'


runs:
  using: 'node24'
  main: 'dist/index.cjs'
