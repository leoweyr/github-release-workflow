name: 'Publish GitHub Release'
description: 'Create a GitHub Release from a merged release pull request.'


inputs:
  access-token:
    description: 'GitHub token used to create the release.'
    required: true

  pull-request-merged:
    description: 'Whether the release pull request was merged.'
    required: true

  pull-request-title:
    description: 'Merged release pull request title.'
    required: true

  release-body:
    description: 'Release notes copied from the merged pull request body.'
    required: false
    default: ''

  working-directory:
    description: 'Checked-out caller repository containing the release tag.'
    required: false
    default: '.'


outputs:
  tag-name:
    description: 'Original Git tag used for the release.'
  release-version:
    description: 'Release version without the `v` prefix.'
  release-title:
    description: 'GitHub Release title.'
  release-at:
    description: 'UTC timestamp of the tagged commit.'
  package-name:
    description: 'Monorepo package name, or an empty string for monolith repository.'
  github-release-url:
    description: 'Created GitHub Release URL.'


runs:
  using: 'node24'
  main: 'dist/index.cjs'
