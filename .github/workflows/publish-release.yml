name: Publish Release


on:
  pull_request:
    types: [closed]


permissions:
  contents: write
  pull-requests: write


jobs:
  call-publish:
    uses: leoweyr/github-release-workflow/.github/workflows/reusable-publish-release.yml@v2.1.0
    with:
      main-branch: 'master'
      development-branch: 'develop'
    secrets:
      ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
